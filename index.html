<meta charset="UTF-8" />
<title>RGM · Studio Fiscal — Julho 2026</title>
<style>
  :root{
    --blue:#2723F2; --blue-dark:#1800AD;
    --blue-mid:#9AA3F5; --blue-pale:#D6DAFC; --blue-track:#EFEFEF;
    --red:#D6291A; --green:#0F9D4E;
    --gold:#D5AE77; --gold-dark:#927245;
    --meta-bg:#E3E1DC; --table-head:#99ACFF; --table-row:#E3E8FF;
    --bg-dark:#2A2723; --bg:#F4F3F0; --frame:#FFFFFF;
    --text:#1B1A18; --text-muted:#8A867E; --text-muted2:#5B584F;
    --rule:#DEDBD3;
    --font: Calibri, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-theme="dark"]{
    --bg:#171613; --frame:#211F1B; --rule:#3A362E;
    --text:#EFEDE7; --text-muted:#867F72; --text-muted2:#B8B2A5;
    --meta-bg:#2E2B25; --table-row:#232A45; --blue-track:#2A2A2A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171613; --frame:#211F1B; --rule:#3A362E;
      --text:#EFEDE7; --text-muted:#867F72; --text-muted2:#B8B2A5;
      --meta-bg:#2E2B25; --table-row:#232A45; --blue-track:#2A2A2A;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;}
  .stage{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px;}

  /* ---------- COVER ---------- */
  #cover{
    width:min(1180px, 96vw); aspect-ratio:16/9; background:var(--bg-dark);
    border-radius:10px; position:relative; overflow:hidden; color:#fff;
    display:flex; flex-direction:column; justify-content:center;
    padding:clamp(24px,4vw,64px); box-shadow:0 30px 80px -30px rgba(0,0,0,.55);
  }
  #cover img.logo{width:clamp(110px,12vw,170px); position:absolute; top:clamp(20px,3vw,40px); left:50%; transform:translateX(-50%); opacity:.94;}
  #cover .eyebrow{font-size:clamp(13px,1.3vw,17px); letter-spacing:.04em; color:#D9D5CC; margin:0 0 6px;}
  #cover h1{font-size:clamp(34px,6vw,72px); font-weight:700; margin:0; line-height:1.02; text-wrap:balance;}
  #cover .foot{position:absolute; bottom:clamp(16px,2.6vw,30px); left:0; right:0; display:flex; justify-content:space-between; padding:0 clamp(24px,4vw,64px); font-size:clamp(9px,.85vw,12px); color:#B9B4A9;}
  #cover .enter{margin-top:clamp(20px,3vw,36px); align-self:flex-start; background:var(--blue); color:#fff; border:none; border-radius:7px; padding:12px 22px; font-family:var(--font); font-size:15px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px;}
  #cover .enter:hover{background:var(--blue-dark);}
  #cover .enter:focus-visible{outline:2px solid #fff; outline-offset:3px;}

  /* ---------- DASHBOARD FRAME ---------- */
  #dash{width:min(1180px, 96vw); aspect-ratio:16/9; background:var(--frame); border-radius:10px; box-shadow:0 30px 80px -30px rgba(0,0,0,.35); display:none; flex-direction:column; overflow:hidden; position:relative;}
  #dash.active{display:flex;}

  nav.tabs{display:flex; padding:clamp(10px,1.6vw,20px) clamp(14px,2.4vw,32px) 0; gap:4px; border-bottom:1px dashed var(--rule); flex-shrink:0;}
  nav.tabs button{
    flex:1; background:none; border:none; font-family:var(--font); cursor:pointer;
    font-size:clamp(9.5px,1.05vw,13.5px); color:var(--text-muted); padding:0 0 clamp(8px,1.2vw,14px);
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{color:var(--blue); font-weight:700; border-color:var(--blue);}
  nav.tabs button:hover:not(.active){color:var(--text-muted2);}
  nav.tabs button:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}

  .panels{flex:1; position:relative; overflow:hidden;}
  .panel{position:absolute; inset:0; padding:clamp(14px,2.2vw,30px) clamp(16px,2.6vw,34px); overflow-y:auto; display:none;}
  .panel.active{display:block;}
  .panel h2{font-size:clamp(13px,1.5vw,18px); font-weight:700; margin:0 0 4px; color:var(--text);}
  .panel .sub{font-size:clamp(9.5px,1vw,12.5px); color:var(--text-muted2); margin:0 0 clamp(10px,1.8vw,22px);}
  .panel .kicker{font-size:clamp(11px,1.3vw,15px); font-weight:700; color:var(--text-muted2); margin:0 0 clamp(10px,1.6vw,16px); text-transform:uppercase; letter-spacing:.03em;}

  progress-shell{display:block;}
  .progress{position:absolute; left:0; right:0; bottom:0; height:clamp(6px,.9vw,10px); display:flex; gap:2px; padding:0 0;}
  .progress .seg{flex:1; background:var(--blue-track); position:relative; overflow:hidden;}
  .progress .seg .fill{position:absolute; inset:0; width:0%; transition:width .35s ease;}
  .progress .seg:nth-child(1) .fill{background:var(--blue);}
  .progress .seg:nth-child(2) .fill{background:var(--blue-mid);}
  .progress .seg:nth-child(3) .fill{background:var(--blue-pale);}

  .navarrow{position:absolute; bottom:clamp(16px,2.6vw,26px); width:clamp(30px,3.4vw,40px); height:clamp(30px,3.4vw,40px); border-radius:50%; border:1px solid var(--rule); background:var(--frame); color:var(--text-muted2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; z-index:5;}
  .navarrow:hover{border-color:var(--blue); color:var(--blue);}
  .navarrow:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .navarrow.prev{right:clamp(60px,6vw,78px);}
  .navarrow.next{right:clamp(14px,2vw,26px);}
  .navarrow[disabled]{opacity:.3; cursor:default;}
  .navarrow[disabled]:hover{border-color:var(--rule); color:var(--text-muted2);}

  /* ---------- Resultado: stacked mini bar-charts ---------- */
  .mb-row{display:flex; align-items:flex-end; gap:clamp(8px,1.2vw,14px); margin-bottom:clamp(10px,1.6vw,18px);}
  .mb-title{width:clamp(58px,7.5vw,92px); flex-shrink:0; font-size:clamp(9px,.95vw,12px); font-weight:700; color:var(--text-muted2); padding-bottom:clamp(14px,2vw,22px);}
  .mb-grid{flex:1; display:grid; grid-template-columns:repeat(7,1fr); gap:clamp(4px,.8vw,10px); align-items:end; height:clamp(64px,8.5vw,96px);}
  .mb-cell{display:grid; grid-template-rows:auto 1fr; justify-items:center; height:100%;}
  .mb-val{font-size:clamp(8.5px,.9vw,11.5px); font-variant-numeric:tabular-nums; color:var(--text); margin-bottom:3px; white-space:nowrap;}
  .mb-bar{width:100%; align-self:end; border-radius:2px 2px 0 0;}
  .mb-labels{display:flex; gap:clamp(8px,1.2vw,14px);}
  .mb-labels .spacer{width:clamp(58px,7.5vw,92px); flex-shrink:0;}
  .mb-labels .lgrid{flex:1; display:grid; grid-template-columns:repeat(7,1fr); gap:clamp(4px,.8vw,10px);}
  .mb-labels .lgrid span{text-align:center; font-size:clamp(8.5px,.88vw,11px); color:var(--text-muted);}

  /* ---------- Organograma ---------- */
  .org-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,2.4vw,30px) clamp(18px,3vw,40px); margin-bottom:clamp(14px,2.2vw,26px);}
  .org-card{display:flex; gap:clamp(8px,1.2vw,14px); align-items:flex-start;}
  .org-card img{width:clamp(42px,5.2vw,64px); height:clamp(42px,5.2vw,64px); border-radius:6px; object-fit:cover; flex-shrink:0;}
  .org-card .nome{font-size:clamp(11px,1.15vw,15px); font-weight:700; color:var(--text); margin:0 0 2px;}
  .org-card .cargo{font-size:clamp(9px,.92vw,11.5px); color:var(--text-muted2); line-height:1.5;}
  .org-stats{display:flex; border-top:1px solid var(--rule); padding-top:clamp(10px,1.8vw,20px);}
  .org-stats .st{flex:1; text-align:center;}
  .org-stats .st .lbl{font-size:clamp(8px,.85vw,10.5px); font-weight:700; color:var(--blue); text-transform:uppercase; letter-spacing:.02em;}
  .org-stats .st .val{font-size:clamp(16px,2.4vw,30px); font-weight:700; color:var(--blue); font-variant-numeric:tabular-nums;}

  /* ---------- KPI's ---------- */
  .kpi-box{background:var(--meta-bg); border:1px solid var(--gold); border-radius:8px; padding:clamp(10px,1.6vw,18px) clamp(6px,1vw,12px); display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:clamp(14px,2vw,22px);}
  .kpi-box .item{text-align:center;}
  .kpi-box .item .l{font-size:clamp(8.5px,.88vw,11.5px); font-weight:700; color:var(--text); margin-bottom:4px;}
  .kpi-box .item .v{font-size:clamp(13px,1.8vw,21px); font-weight:700; font-variant-numeric:tabular-nums;}
  .kpi-box .item .v.red{color:var(--red);} .kpi-box .item .v.green{color:var(--green);}
  .kpi-box .item .meta{margin-top:5px; background:var(--frame); border-radius:4px; padding:3px 4px; font-size:clamp(8px,.85vw,10.5px); color:var(--text-muted2);}
  .kpi-row{display:grid; gap:6px; margin-bottom:clamp(10px,1.6vw,18px);}
  .kpi-row.mid{grid-template-columns:repeat(5,1fr);}
  .kpi-row.bot{grid-template-columns:repeat(4,1fr);}
  .kpi-row .item{text-align:center;}
  .kpi-row .item .l{font-size:clamp(8.5px,.88vw,11px); color:var(--text); margin-bottom:5px;}
  .kpi-row .item .v{font-size:clamp(12px,1.5vw,17px); font-weight:700; color:var(--red); font-variant-numeric:tabular-nums;}
  .footnote{font-size:clamp(7.5px,.78vw,9.5px); font-style:italic; color:var(--text-muted2); margin-top:clamp(10px,1.6vw,16px); line-height:1.5;}

  /* ---------- Retornos ---------- */
  .ret-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,2vw,22px) clamp(10px,1.6vw,18px);}
  .ret-grid .item .l{font-size:clamp(9px,.95vw,11.5px); color:var(--text); margin-bottom:5px;}
  .ret-grid .item .v{font-size:clamp(13px,1.7vw,19px); font-weight:700; color:var(--red); font-variant-numeric:tabular-nums;}

  /* ---------- Dificuldades / Considerações placeholders ---------- */
  .ph-grid{display:grid; grid-template-columns:1fr 1fr; gap:clamp(14px,2.2vw,26px) clamp(20px,3vw,40px);}
  .ph-item{border-left:3px solid var(--blue); padding-left:clamp(10px,1.4vw,16px); font-size:clamp(10px,1.05vw,13px); font-style:italic; color:var(--text-muted2); line-height:1.55;}
  .ph-list .ph-item{border-left:3px solid var(--blue); margin-bottom:clamp(12px,1.8vw,20px);}

  /* ---------- Tables (Ações / Processos / Pedidos) ---------- */
  .twrap{overflow-x:auto; margin-bottom:clamp(10px,1.6vw,16px);}
  table.rgm{width:100%; border-collapse:collapse; font-size:clamp(9px,.95vw,12px);}
  table.rgm th{background:var(--table-head); color:#0B0A2E; font-weight:700; text-align:left; padding:clamp(6px,1vw,10px); white-space:nowrap;}
  table.rgm td{padding:clamp(9px,1.4vw,14px) clamp(6px,1vw,10px); border-bottom:1px solid var(--rule); color:var(--text-muted);}
  table.rgm tr:nth-child(even) td{background:var(--table-row);}
  .table-note{font-size:clamp(9px,.95vw,11.5px); font-weight:700; color:var(--text-muted2); margin-top:2px;}

  /* ---------- Projeção ---------- */
  .proj-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(16px,2.6vw,30px); margin-top:clamp(6px,1vw,10px);}
  .proj-item .l{font-size:clamp(11px,1.25vw,15px); color:var(--text); margin-bottom:6px;}
  .proj-item .v{font-size:clamp(19px,2.8vw,32px); font-weight:700; color:var(--red); font-variant-numeric:tabular-nums; line-height:1.15;}
  .proj-item .g{font-size:clamp(11px,1.4vw,17px); color:var(--text-muted); font-variant-numeric:tabular-nums;}

  /* ---------- Obrigado ---------- */
  #obrigado.active{display:flex; align-items:flex-end; justify-content:flex-end; padding:clamp(20px,3vw,36px);}
  #obrigado .txt{font-size:clamp(14px,1.6vw,18px); font-weight:700; color:var(--blue-dark);}

  @media (max-width:640px){
    nav.tabs button{font-size:9px;}
    .kpi-box{grid-template-columns:repeat(3,1fr); row-gap:14px;}
    .kpi-row.mid{grid-template-columns:repeat(3,1fr); row-gap:12px;}
    .kpi-row.bot{grid-template-columns:repeat(2,1fr); row-gap:12px;}
    .ret-grid{grid-template-columns:repeat(2,1fr);}
    .org-grid{grid-template-columns:repeat(2,1fr);}
    .ph-grid{grid-template-columns:1fr;}
    .proj-grid{grid-template-columns:1fr;}
  }
</style>

  panelsData["KPI's"] = function(){

    var bot = [['Custo por MQL','R$ 447,35'],['Custo por FPQ','R$ 1.736,77'],['Custo de CC1','R$ 835,61'],['Custo de Aquisição Franquia','R$ 12.653,59']];

  };

  panelsData['Dificuldades'] = function(){

      'Adicione aqui a 1ª dificuldade do mês — ex.: fatores que impactaram comissão, negociação ou funil',

  };

    var thead = '<tr>'+head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>';

      '<div class="twrap"><table class="rgm">'+thead+tbody+'</table></div>' +
      '<p class="table-note">Cole aqui suas ações feitas e a realizar</p>';

      '<p class="footnote">Algumas métricas de meta não disponíveis para este período.</p>';

      ['Caixa Projetado','R$ 446.200','R$ 577.700'],
      ['Unidades Projetadas','9','12'],

      return '<div class="proj-item"><div class="l">'+it[0]+'</div><div class="v">'+it[1]+'</div><div class="g">'+it[2]+'</div></div>';

  panelsData['Processos'] = function(){
    var head = ['Área','Processo','Tipo','Responsável','Vigência'];
    var rows = [['','','','',''],['','','','',''],['','','','','']];

    var ph = ['Adicione aqui a 1ª consideração final','Adicione aqui a 2ª consideração final','Adicione aqui a 3ª consideração final'];

    var rows = [['','','','','',''],['','','','','',''],['','','','','',''],['','','','','','']];

  // ---- render tabs + panels ----
  var tabsNav = document.getElementById('tabsNav');
  var panels = document.getElementById('panels');
  TABS.forEach(function(t, i){
    var btn = document.createElement('button');
    btn.textContent = t;
    btn.dataset.idx = i;
    btn.addEventListener('click', function(){ goTo(i); });
    tabsNav.appendChild(btn);

    var div = document.createElement('div');
    div.className = 'panel';
    div.dataset.idx = i;
    div.innerHTML = panelsData[t]();
    panels.appendChild(div);
  });
  var obrigado = document.createElement('div');
  obrigado.className = 'panel';
  obrigado.id = 'obrigado';
  obrigado.dataset.idx = TABS.length;
  obrigado.innerHTML = '<div class="txt">Obrigado</div>';
  panels.appendChild(obrigado);

  var current = 0;
  function goTo(i){
    current = Math.max(0, Math.min(TABS.length, i));
    Array.prototype.forEach.call(tabsNav.children, function(b, bi){ b.classList.toggle('active', bi===current); });
    Array.prototype.forEach.call(panels.children, function(p, pi){ p.classList.toggle('active', pi===current); });
    updateProgress();
    document.getElementById('prevBtn').disabled = current===0;
    document.getElementById('nextBtn').disabled = current===TABS.length;
  }
  function updateProgress(){
    var filled = (Math.min(current, TABS.length-1) + 1) / TABS.length;
    var bounds = [0, 0.34, 0.67, 1];
    var segs = document.querySelectorAll('#progress .seg .fill');
    for (var i=0;i<3;i++){
      var f = Math.max(0, Math.min(1, (filled - bounds[i]) / (bounds[i+1]-bounds[i])));
      segs[i].style.width = (f*100)+'%';
    }
  }

  document.getElementById('prevBtn').addEventListener('click', function(){ goTo(current-1); });
  document.getElementById('nextBtn').addEventListener('click', function(){ goTo(current+1); });
  document.addEventListener('keydown', function(e){
    if (!document.getElementById('dash').classList.contains('active')) return;
    if (e.key==='ArrowRight') goTo(current+1);
    if (e.key==='ArrowLeft') goTo(current-1);
  });

  document.getElementById('enterBtn').addEventListener('click', function(){
    document.getElementById('cover').style.display = 'none';
    document.getElementById('dash').classList.add('active');
    goTo(0);
  });
})();
